<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rally ACU</title>
  <script>
    (function() {
      var path = window.location.pathname;
      var clean = path.replace(/\/$/, '');
      var segment = clean.split('/').pop().toLowerCase();

      // Handle home or empty route -> redirect to root
      if (segment === 'home' || segment === '' || segment === 'index') {
        window.location.replace('/' + window.location.search + window.location.hash);
        return;
      }

      // Valid clean pages mapping
      var validPages = {
        'seasons': '/seasons.html',
        'team': '/team.html',
        'final-festival': '/final-festival.html',
        'achievements': '/achievements.html'
      };

      if (validPages[segment]) {
        window.location.replace(validPages[segment] + window.location.search + window.location.hash);
        return;
      }

      // Fallback redirect to root
      window.location.replace('/' + window.location.search + window.location.hash);
    })();
  </script>
</head>
<body style="background:#09090b; color:#fff; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
  <p>Navigating to <a href="/" style="color:#ef4444; text-decoration:none; font-weight:bold;">Rally ACU</a>...</p>
</body>
</html>
